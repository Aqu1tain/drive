name: drive

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NUXT_DATABASE_URL: postgres://drive:drive@db:5432/drive
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:?set NUXT_AUTH_SECRET in .env}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-http://localhost:3000}
      NUXT_PUBLIC_USERCONTENT_URL: ${NUXT_PUBLIC_USERCONTENT_URL:-http://127.0.0.1:3000}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-Drive}
      NUXT_STORAGE_DRIVER: ${NUXT_STORAGE_DRIVER:-s3}
      NUXT_STORAGE_LOCAL_DIR: /data/storage
      NUXT_STORAGE_S3_ENDPOINT: http://minio:9000
      NUXT_STORAGE_S3_REGION: us-east-1
      NUXT_STORAGE_S3_BUCKET: drive
      NUXT_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-drive}
      NUXT_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-drive-secret}
      NUXT_STORAGE_S3_FORCE_PATH_STYLE: "true"
      NUXT_SMTP_URL: ${NUXT_SMTP_URL:-smtp://mailpit:1025}
      NUXT_SMTP_FROM: ${NUXT_SMTP_FROM:-Drive <drive@localhost>}
    volumes:
      - app-data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-drive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-drive-secret}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8125}:8025"
      - "${MAILPIT_SMTP_PORT:-1125}:1025"

volumes:
  app-data:
  db-data:
  minio-data:
