# Production stack. Configure through .env (see .env.example or run ./install.sh).
name: drive

services:
  app:
    image: ${DRIVE_IMAGE:-ghcr.io/aqu1tain/drive:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # App and isolated user content are two origins served by the same container.
      # Bound to localhost when Caddy handles HTTPS; set APP_BIND=0.0.0.0 to expose them directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
      - "${APP_BIND:-127.0.0.1}:${CONTENT_PORT:-3001}:3000"
    environment:
      NUXT_DATABASE_URL: postgres://drive:${POSTGRES_PASSWORD:?run ./install.sh or set POSTGRES_PASSWORD}@db:5432/drive
      NUXT_AUTH_SECRET: ${AUTH_SECRET:?run ./install.sh or set AUTH_SECRET}
      NUXT_SETUP_TOKEN: ${SETUP_TOKEN:-}
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}
      NUXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NUXT_PUBLIC_USERCONTENT_URL: ${USERCONTENT_URL:-http://localhost:3001}
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-Drive}
      NUXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      NUXT_STORAGE_DRIVER: s3
      NUXT_STORAGE_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      NUXT_STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
      NUXT_STORAGE_S3_BUCKET: ${S3_BUCKET:-drive}
      NUXT_STORAGE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-drive}
      NUXT_STORAGE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run ./install.sh or set S3_SECRET_ACCESS_KEY}
      NUXT_STORAGE_S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      NUXT_SMTP_URL: ${SMTP_URL:-}
      NUXT_SMTP_FROM: ${SMTP_FROM:-Drive <drive@localhost>}
      NUXT_UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
      NUXT_STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-107374182400}
      NUXT_ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-365}
      NUXT_ACTIVITY_IP_MODE: ${ACTIVITY_IP_MODE:-hash}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh or set POSTGRES_PASSWORD}
      POSTGRES_DB: drive
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-drive}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?run ./install.sh or set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [https]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      CONTENT_DOMAIN: ${CONTENT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
